[databases]
SimpleUrlShortener = host=postgresql port=5432 dbname=SimpleUrlShortener

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 200
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

server_login_retry = 1

admin_users = root
stats_users = root